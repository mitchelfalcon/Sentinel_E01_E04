<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390"><rect width="1200" height="390" fill="white"/><text x="600" y="44" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="29" font-weight="700" fill="#B51B33">E03  •  Mini-servidores de aplicación</text><rect x="55" y="100" width="290" height="171" rx="12" fill="#FAECEF" stroke="#B51B33" stroke-width="2"/><text x="200.0" y="149" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">A • iPhone</text><text x="200.0" y="188" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Navegador / LUNA</text><text x="200.0" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Emisor Wi-Fi</text><rect x="456" y="100" width="290" height="171" rx="12" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="2"/><text x="601.0" y="149" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">B • Laptop</text><text x="601.0" y="188" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Relay HTTP 8081</text><text x="601.0" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">ACK y bitácora</text><rect x="859" y="100" width="290" height="171" rx="12" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="2"/><text x="1004.0" y="149" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">C • Kali</text><text x="1004.0" y="188" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Sink HTTP 8080</text><text x="1004.0" y="218" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Hash y CSV</text><path d="M352 180 L443 180" fill="none" stroke="#B51B33" stroke-width="4" stroke-linecap="round"/><polygon points="443,180 429,172 429,188" fill="#B51B33"/><path d="M752 180 L847 180" fill="none" stroke="#B51B33" stroke-width="4" stroke-linecap="round"/><polygon points="847,180 833,172 833,188" fill="#B51B33"/><text x="600" y="324" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="400" fill="#636B75">Relay en máquina diferente = retransmisión de aplicación; no implica 2 saltos de radio.</text></svg>