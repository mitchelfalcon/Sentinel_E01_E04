<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect width="1200" height="400" fill="white"/><text x="600" y="44" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="29" font-weight="700" fill="#B51B33">E02  •  HOT frente a COLD</text><rect x="78" y="92" width="290" height="160" rx="12" fill="#FAECEF" stroke="#B51B33" stroke-width="2"/><text x="223.0" y="141" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">iPhone Safari</text><text x="223.0" y="180" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Mensaje sintético</text><text x="223.0" y="210" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">Wi-Fi local</text><rect x="462" y="92" width="278" height="160" rx="12" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="2"/><text x="601.0" y="141" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">Router/AP</text><text x="601.0" y="180" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">HOT: ZTE con WAN</text><text x="601.0" y="210" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">COLD: Steren sin WAN</text><rect x="828" y="92" width="290" height="160" rx="12" fill="#F7F8FA" stroke="#E4E7EA" stroke-width="2"/><text x="973.0" y="141" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="26" font-weight="700" fill="#B51B33">Kali Ethernet</text><text x="973.0" y="180" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">HTTP :8080</text><text x="973.0" y="210" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="400" fill="#212733">ACK + CSV</text><path d="M376 165 L448 165" fill="none" stroke="#B51B33" stroke-width="4" stroke-linecap="round"/><polygon points="448,165 434,157 434,173" fill="#B51B33"/><path d="M748 165 L813 165" fill="none" stroke="#B51B33" stroke-width="4" stroke-linecap="round"/><polygon points="813,165 799,157 799,173" fill="#B51B33"/><text x="600" y="306" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="18" font-weight="400" fill="#212733">HOT: internet disponible en router. COLD: aislamiento físico WAN verificado.</text><text x="600" y="338" font-family="DejaVu Sans,Arial,sans-serif" text-anchor="middle" font-size="17" font-weight="600" fill="#B51B33">Seleccionar COLD en Safari no demuestra desconexión de internet.</text></svg>